name: HarmonyOS CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HARMONYOS_CLI_ARCHIVE: commandline-tools-linux-x64-6.1.0.816.zip
      HARMONYOS_CLI_SHA256: 4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install HarmonyOS SDK
        run: |
          set -euxo pipefail
          cli_url="https://github.com/Okysu/harmony-auto-build/releases/download/${HARMONYOS_CLI_ARCHIVE%.zip}/${HARMONYOS_CLI_ARCHIVE}"
          curl --fail -L -o "${HARMONYOS_CLI_ARCHIVE}" "${cli_url}"
          echo "${HARMONYOS_CLI_SHA256}  ${HARMONYOS_CLI_ARCHIVE}" | sha256sum --check --status

          sdk_root="${RUNNER_TEMP}/harmonyos-tools"
          rm -rf "${sdk_root}"
          mkdir -p "${sdk_root}"
          unzip -q "${HARMONYOS_CLI_ARCHIVE}" -d "${sdk_root}"
          rm "${HARMONYOS_CLI_ARCHIVE}"

          sdkmgr_path="$(find "${sdk_root}/command-line-tools" -type f -name sdkmgr -print -quit)"
          test -n "${sdkmgr_path}"
          chmod +x "${sdkmgr_path}"
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Duser.country=CN"
          "${sdkmgr_path}" install java:6 js:6 ets:6 toolchains:6 native:6 --accept-license

          sdk_home="${sdk_root}/command-line-tools/sdk/default/openharmony"
          hap_sign_tool_path="${sdk_home}/toolchains/lib/hap-sign-tool.jar"

          test -f "${hap_sign_tool_path}"

          echo "DEVECO_SDK_HOME=${sdk_home}" >> "${GITHUB_ENV}"
          echo "OHOS_BASE_SDK_HOME=${sdk_home}" >> "${GITHUB_ENV}"
          echo "HOS_SDK_HOME=${sdk_home}" >> "${GITHUB_ENV}"
          echo "HAP_SIGN_TOOL_PATH=${hap_sign_tool_path}" >> "${GITHUB_ENV}"
          echo "${sdk_root}/command-line-tools/bin" >> "${GITHUB_PATH}"
          echo "${sdk_home}/toolchains" >> "${GITHUB_PATH}"
          echo "${sdk_home}/toolchains/node/bin" >> "${GITHUB_PATH}"
          echo "${sdk_home}/toolchains/ohpm/bin" >> "${GITHUB_PATH}"
          echo "${sdk_home}/toolchains/hvigor/bin" >> "${GITHUB_PATH}"

      - name: Configure registries
        run: |
          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/

      - name: Install dependencies
        run: |
          ohpm install --all

      - name: Build HAP
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Get build output path
        id: get_build_output_path
        run: |
          echo "output_path=$(ls -d $PWD/entry/build/default/outputs/default)" >> $GITHUB_OUTPUT

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ steps.get_build_output_path.outputs.output_path }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      HARMONYOS_CLI_ARCHIVE: commandline-tools-linux-x64-6.1.0.816.zip
      HARMONYOS_CLI_SHA256: 4b21e8a4ce19fc7eb381425a570e936c80067b8a0bef9cdcfe8a49e4764038e2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install HarmonyOS SDK
        run: |
          set -euxo pipefail
          cli_url="https://github.com/Okysu/harmony-auto-build/releases/download/${HARMONYOS_CLI_ARCHIVE%.zip}/${HARMONYOS_CLI_ARCHIVE}"
          curl --fail -L -o "${HARMONYOS_CLI_ARCHIVE}" "${cli_url}"
          echo "${HARMONYOS_CLI_SHA256}  ${HARMONYOS_CLI_ARCHIVE}" | sha256sum --check --status

          sdk_root="${RUNNER_TEMP}/harmonyos-tools"
          rm -rf "${sdk_root}"
          mkdir -p "${sdk_root}"
          unzip -q "${HARMONYOS_CLI_ARCHIVE}" -d "${sdk_root}"
          rm "${HARMONYOS_CLI_ARCHIVE}"

          sdk_home="${sdk_root}/command-line-tools/sdk/default/openharmony"
          hap_sign_tool_path="${sdk_home}/toolchains/lib/hap-sign-tool.jar"
          test -f "${hap_sign_tool_path}"
          echo "DEVECO_SDK_HOME=${sdk_home}" >> "${GITHUB_ENV}"
          echo "HAP_SIGN_TOOL_PATH=${hap_sign_tool_path}" >> "${GITHUB_ENV}"

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: $GITHUB_WORKSPACE/entry/build/default/outputs/default

      - name: Sign HAP
        id: sign_hap
        if: env.SIGNING_CERT && env.SIGNING_PROFILE && env.SIGNING_KEY
        run: |
          java -jar "${HAP_SIGN_TOOL_PATH}" \
          sign-app \
          -keyAlias "ide_demo_app" \
          -signAlg "SHA256withECDSA" \
          -mode "localSign" \
          -appCertFile "${{ env.SIGNING_CERT }}" \
          -profileFile "${{ env.SIGNING_PROFILE }}" \
          -inFile "./entry/build/default/outputs/default/entry-default-unsigned.hap" \
          -keystoreFile "${{ env.SIGNING_KEY }}" \
          -outFile "./entry/build/default/outputs/default/entry-default-signed.hap" \
          -keyPwd "${{ secrets.KEY_PASSWORD }}" \
          -keystorePwd "${{ secrets.KEYSTORE_PASSWORD }}" \
          -signCode "1"

      - name: Resolve release asset
        id: release_asset
        run: |
          if [ -f "$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-signed.hap" ]; then
            echo "file=$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-signed.hap" >> "$GITHUB_OUTPUT"
          else
            echo "file=$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.release_asset.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
