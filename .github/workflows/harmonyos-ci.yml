name: HarmonyOS CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HARMONYOS_SDK_RELEASE: 6.1-Release
      HARMONYOS_SDK_ARCHIVE: ohos-sdk-windows_linux-public.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install HarmonyOS SDK
        run: |
          set -euxo pipefail
          sdk_url="https://repo.huaweicloud.com/harmonyos/os/${HARMONYOS_SDK_RELEASE}/${HARMONYOS_SDK_ARCHIVE}"
          curl --fail -L -O "${sdk_url}"
          curl --fail -L -O "${sdk_url}.sha256"
          echo "$(cat "${HARMONYOS_SDK_ARCHIVE}.sha256") ${HARMONYOS_SDK_ARCHIVE}" | sha256sum --check --status

          sdk_root="${RUNNER_TEMP}/harmonyos-sdk"
          rm -rf "${sdk_root}"
          mkdir -p "${sdk_root}"
          tar -xf "${HARMONYOS_SDK_ARCHIVE}" -C "${sdk_root}"
          rm "${HARMONYOS_SDK_ARCHIVE}" "${HARMONYOS_SDK_ARCHIVE}.sha256"

          cd "${sdk_root}/linux"
          for archive in *.zip; do
            unzip -q "${archive}"
          done

          hap_sign_tool_path="$(find "${sdk_root}/linux" -type f -name 'hap-sign-tool.jar' -print -quit)"

          test -n "${hap_sign_tool_path}"

          echo "DEVECO_SDK_HOME=${sdk_root}/linux" >> "${GITHUB_ENV}"
          echo "OHOS_BASE_SDK_HOME=${sdk_root}/linux" >> "${GITHUB_ENV}"
          echo "HOS_SDK_HOME=${sdk_root}/linux" >> "${GITHUB_ENV}"
          echo "HAP_SIGN_TOOL_PATH=${hap_sign_tool_path}" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          npm install
          npm install --no-save @ohos/hvigor@6.26.1 @ohos/hvigor-ohos-plugin@6.26.1

      - name: Build HAP
        run: |
          npx hvigor clean --no-daemon
          npx hvigor assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Get build output path
        id: get_build_output_path
        run: |
          echo "output_path=$(ls -d $PWD/entry/build/default/outputs/default)" >> $GITHUB_OUTPUT

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ steps.get_build_output_path.outputs.output_path }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      HARMONYOS_SDK_RELEASE: 6.1-Release
      HARMONYOS_SDK_ARCHIVE: ohos-sdk-windows_linux-public.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install HarmonyOS SDK
        run: |
          set -euxo pipefail
          sdk_url="https://repo.huaweicloud.com/harmonyos/os/${HARMONYOS_SDK_RELEASE}/${HARMONYOS_SDK_ARCHIVE}"
          curl --fail -L -O "${sdk_url}"
          curl --fail -L -O "${sdk_url}.sha256"
          echo "$(cat "${HARMONYOS_SDK_ARCHIVE}.sha256") ${HARMONYOS_SDK_ARCHIVE}" | sha256sum --check --status

          sdk_root="${RUNNER_TEMP}/harmonyos-sdk"
          rm -rf "${sdk_root}"
          mkdir -p "${sdk_root}"
          tar -xf "${HARMONYOS_SDK_ARCHIVE}" -C "${sdk_root}"
          rm "${HARMONYOS_SDK_ARCHIVE}" "${HARMONYOS_SDK_ARCHIVE}.sha256"

          cd "${sdk_root}/linux"
          for archive in *.zip; do
            unzip -q "${archive}"
          done

          echo "DEVECO_SDK_HOME=${sdk_root}/linux" >> "${GITHUB_ENV}"
          hap_sign_tool_path="$(find "${sdk_root}/linux" -type f -name 'hap-sign-tool.jar' -print -quit)"
          test -n "${hap_sign_tool_path}"
          echo "HAP_SIGN_TOOL_PATH=${hap_sign_tool_path}" >> "${GITHUB_ENV}"

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: $GITHUB_WORKSPACE/entry/build/default/outputs/default

      - name: Sign HAP
        id: sign_hap
        if: env.SIGNING_CERT && env.SIGNING_PROFILE && env.SIGNING_KEY
        run: |
          java -jar "${HAP_SIGN_TOOL_PATH}" \
          sign-app \
          -keyAlias "ide_demo_app" \
          -signAlg "SHA256withECDSA" \
          -mode "localSign" \
          -appCertFile "${{ env.SIGNING_CERT }}" \
          -profileFile "${{ env.SIGNING_PROFILE }}" \
          -inFile "./entry/build/default/outputs/default/entry-default-unsigned.hap" \
          -keystoreFile "${{ env.SIGNING_KEY }}" \
          -outFile "./entry/build/default/outputs/default/entry-default-signed.hap" \
          -keyPwd "${{ secrets.KEY_PASSWORD }}" \
          -keystorePwd "${{ secrets.KEYSTORE_PASSWORD }}" \
          -signCode "1"

      - name: Resolve release asset
        id: release_asset
        run: |
          if [ -f "$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-signed.hap" ]; then
            echo "file=$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-signed.hap" >> "$GITHUB_OUTPUT"
          else
            echo "file=$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-unsigned.hap" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.release_asset.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
